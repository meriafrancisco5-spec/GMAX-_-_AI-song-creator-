<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V5.5 AI Song Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
    }

    .app {
      max-width: 700px;
      margin: auto;
      padding: 25px 18px;
    }

    h1 {
      text-align: center;
      font-size: 38px;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    .card {
      background: #17171f;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 15px 0 8px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #0e0e13;
      color: white;
      font-size: 16px;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: none;
      border-radius: 12px;
      background: #7c3aed;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #9333ea;
    }

    #status {
      text-align: center;
      color: #aaa;
      margin: 15px 0;
    }

    #lyrics {
      white-space: pre-wrap;
      line-height: 1.7;
      color: #eee;
    }
  </style>
</head>

    <p class="subtitle">AI Song Generator</p>

    <div class="card">

        <option>Drill</option>
        <option>Trap</option>
        <option>Hip Hop</option>
        <option>Love Song</option>
        <option>Afrobeats</option>
      </select>

      <label>Language</label>

        <option>English</option>
        <option>Chichewa</option>
        <option>English + Chichewa</option>
      </select>

      <label>Song idea</label>
      <textarea id="idea" placeholder="What should the song talk about?"></textarea>

      <button onclick="generateSong()">🎤 Generate Lyrics</button>

    </div>

    <div id="status"></div>

    <div class="card">
      <h2>Your Song 🎶</h2>
      <div id="lyrics">Your generated lyrics will appear here...</div>
    </div>

  </div>
